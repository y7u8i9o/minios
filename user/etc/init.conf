# Programs started by init (init.conf(5)). Entries run in file order:
# a task is waited for, a service runs in the background and is
# restarted when it exits, the console entry is the session on the
# console. initctl(1) lists and controls them; "initctl reload" applies
# changes to this file.
env PATH=/bin HOME=/home USER=user SHELL=/bin/sh TERM=minios
# The persistent volumes of /etc/fstab, before anything uses /home.
task fsinit fsinit
# /etc/network: static addresses, or dhcpc in the background.
task network net apply
# The shell on the console. Replace sh with startgui for a graphical
# session at boot.
console sh sh
