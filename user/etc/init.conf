# Programs started by init (init.conf(5)). Entries run in file order:
# a task is waited for, a service runs in the background and is
# restarted when it exits, the console entry is the session on the
# console. initctl(1) lists and controls them; "initctl reload" applies
# changes to this file.
env PATH=/usr/bin TERM=minios
# The persistent volumes of /etc/fstab, before anything uses /home.
task fsinit fsinit
task update pkg-update
# The layout of the console keyboard from the keymap setting (loadkeys(1)).
task keymap loadkeys -c
# The audio server, when the machine has a PCM device.
service audio if=/dev/pcm0 audiod
# The static entries of /etc/network, then the DHCP client for its dhcp
# entry; the client exits with status 0 when there is none.
task network net apply
service dhcp restart=failure dhcpc -a
# The clock from the time servers of /etc/ntp.conf (ntpd(1)), when the
# package net is installed.
service ntp if=/usr/bin/ntpd ntpd
# The graphical login (greeter(1)), which runs the console login (login(1))
# in its place on a machine without a display. Replace greeter with login
# for the console login alone.
console greeter greeter
