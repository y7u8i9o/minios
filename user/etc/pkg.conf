# This file names the package repositories of pkg(1), which are searched
# in the order of their lines.
#   repo NAME http[s]://HOST[:PORT]/PATH
# The index of each repository must be signed by a key in /etc/pkg/keys.
# pkg replaces $arch in a URL with the machine name of the system. The
# repository below is the package registry of code.calcraft.org, which
# `make publish-repo` fills. An https:// URL uses the trust store
# /etc/ssl/cert.pem.
repo calcraft https://code.calcraft.org/api/packages/flifez/generic/minios-$arch/repo
# The repository that `make repo` writes to build/repo/ARCH on the host is
# served there with `python3 -m http.server -d build/repo 8000`. The
# following line, without the comment sign, adds it.
# repo build http://10.0.2.2:8000/$arch
# The timeout gives the seconds that a connection and every wait for data
# may take.
timeout 30
