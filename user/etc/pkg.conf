# Package repositories for pkg(1), searched in the order listed:
#   repo NAME http[s]://HOST[:PORT]/PATH
# Each repository's index must be signed by a key in /etc/pkg/keys.
# pkg replaces $arch in a URL with the system's machine type.
#
# The calcraft repository is the package registry on code.calcraft.org.
# `make publish-repo` uploads to it. HTTPS certificates are checked
# against /etc/ssl/cert.pem.
repo calcraft https://code.calcraft.org/api/packages/flifez/generic/minios-$arch/repo
# To use the repository that `make repo` writes to build/repo/ARCH on the
# host, serve it with `python3 -m http.server -d build/repo 8000` and
# remove the # from the next line.
# repo build http://10.0.2.2:8000/$arch

# Seconds pkg waits for a connection, and for each read after it.
timeout 30
